name: CI — Qualidade e Build

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Verificar código
    runs-on: ubuntu-latest

    steps:
      
name: Checkout do código
      uses: actions/checkout@v4

      
name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

      
name: Instalar dependências
      run: npm ci

      
name: Executar lint
      run: npm run lint

  build:
    name: Verificar Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      
name: Checkout do código
      uses: actions/checkout@v4

      
name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

      
name: Instalar dependências
      run: npm ci

      
name: Build
      run: npm run build